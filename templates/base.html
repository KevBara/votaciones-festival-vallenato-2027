
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Vallenato 2027</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #263238;
        }

        header {
            background-color: #17365d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #24476e;
            padding: 15px;
            text-align: center;
        }

        nav a, nav button {
            color: white;
            margin: 0 12px;
            text-decoration: none;
            font-size: 15px;
        }

        nav button {
            border: none;
            background: transparent;
            cursor: pointer;
        }

        nav form {
            display: inline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            min-height: 350px;
        }

        footer {
            background-color: #17365d;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Festival de la Leyenda Vallenata 2027</h1>
        <p>Sistema web de votaciones</p>
    </header>

    <nav>
        <a href="/">Inicio</a>
        <a href="/ediciones/">Ediciones</a>

        {% if user.is_authenticated %}
            <span style="color: white;">
    Bienvenido, {{ user.username }}
</span>
            <form method="post" action="/logout/">
                {% csrf_token %}
                <button type="submit">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="/login/">Iniciar sesión</a>
            <a href="/registro/">Registrarse</a>
        {% endif %}
    </nav>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <footer>
        <p>Festival Vallenato 2027 - Proyecto académico</p>
    </footer>

</body>
</html>
